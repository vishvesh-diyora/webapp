name: webapp
description: "Flutter website configurator with local storage."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter
  cupertino_icons: ^1.0.8
  shared_preferences: ^2.5.3
  url_launcher: ^6.3.1
  flutter_bloc: ^9.1.1
  equatable: ^2.0.7
  path_provider: ^2.1.5
  image_picker: ^1.1.2
  uuid: ^4.5.1
  path: ^1.9.1
  flutter_dotenv: ^5.2.1
  google_fonts: ^8.2.1
  video_player: ^2.10.0
  web: ^1.1.1
  archive: ^4.5.2
  http: ^1.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - .env
    - assets/export_viewer_bundle.zip
    - tool/serve_export_site.py
