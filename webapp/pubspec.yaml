name: webapp
description: "A production-ready Flutter web and mobile app with Supabase auth."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  supabase_flutter: ^2.9.0
  shared_preferences: ^2.5.3
  url_launcher: ^6.3.1
  flutter_bloc: ^9.1.1
  equatable: ^2.0.7
  path_provider: ^2.1.5
  archive: ^4.0.7
  image_picker: ^1.1.2
  uuid: ^4.5.1
  path: ^1.9.1
  http: ^1.2.2
  crypto: ^3.0.6
  blake3_dart: ^1.0.0
  flutter_secure_storage: ^9.2.4
  flutter_web_auth_2: ^4.1.0
  mime: ^2.0.0
  web: ^1.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
